# TimeLens Temporal Grounding — TempSamp-R1 (Qwen3.5-VL-4B).
#
# Two pieces on top of vanilla GRPO:
#   1. GT injection (algorithm.use_gt_injection=true):
#        With rollout.n=8, every group becomes 7 on-policy samples + 1 GT
#        sample (index gt_replace_index). GT row participates in group
#        mean/std for GRPO advantage just like any other rollout.
#   2. Non-linear reward shaping (env GTPO_REWARD_SHAPING=1, see timelens_reward.py):
#        IoU >= threshold is squashed to a near-flat success plateau and
#        IoU < threshold is exponentially penalised, sharpening the
#        group-relative advantage around the success threshold.

data:
  train_files: ${oc.env:TIMELENS_TRAIN_FILES,/path/to/timelens_train.jsonl}
  val_files: ${oc.env:TIMELENS_VAL_FILES,/path/to/timelens_val.jsonl}

  prompt_key: problem
  answer_key: answer
  image_key: images
  video_key: videos
  use_preprocessed_videos: ${oc.env:TIMELENS_USE_PREPROCESSED,false}
  # Valid: prefer_preprocessed / preprocessed_only / realtime_only
  video_source_mode: ${oc.env:TIMELENS_VIDEO_SOURCE_MODE,realtime_only}
  preprocessed_video_dir: ${oc.env:TIMELENS_PREPROCESSED_VIDEO_DIR,null}
  val_preprocessed_video_dir: ${oc.env:TIMELENS_VAL_PREPROCESSED_VIDEO_DIR,null}
  inline_video_tensors: ${oc.env:TIMELENS_INLINE_VIDEO_TENSORS,false}
  dataloader_num_workers: ${oc.env:TIMELENS_DATALOADER_NUM_WORKERS,8}
  image_dir: null

  # Vision-token cap. qwen_vl_utils treats video_total_pixels as a half-budget
  # (× FRAME_FACTOR=2), so the effective cap is ~28M pixels / ~13.7k tokens.
  video_fps: 2.0
  video_max_frames: 768
  video_min_pixels: 4096
  video_max_pixels: 786432
  video_total_pixels: 14680064
  val_video_fps: 2.0
  val_video_max_frames: 768
  val_video_min_pixels: 4096
  val_video_max_pixels: 786432
  val_video_total_pixels: 14680064
  max_prompt_length: 20480
  max_response_length: 256
  rollout_batch_size: 16
  mini_rollout_batch_size: null
  val_batch_size: 16
  format_prompt: "scripts/timelens/format_prompt/timelens.jinja"
  override_chat_template: null
  shuffle: true
  seed: 42
  filter_overlong_prompts: true

algorithm:
  adv_estimator: grpo
  disable_kl: true
  use_kl_loss: false
  kl_penalty: low_var_kl
  kl_coef: 0.0

  # --- GT injection: overwrite one of the n rollouts per prompt with a GT-built
  # response. gt_replace_index=-1 puts it at slot[-1].
  use_gt_injection: true
  gt_builder: "examples.timelens.timelens_reward:build_gt_response"
  gt_replace_index: -1
  gt_log_exclude: true          # exclude GT row from logged mean reward

worker:
  actor:
    global_batch_size: 16
    micro_batch_size_per_device_for_update: 2
    micro_batch_size_per_device_for_experience: 1
    # GT injection is incompatible with worker.rollout.calculate_log_probs=true
    # (the GT row's response tokens differ from the originally sampled tokens,
    # so vLLM-reported logprobs no longer match — the trainer enforces this).
    # VERL_SKIP_OLD_LOGPROBS=1 is still safe under ppo_epochs=1 +
    # single-mini-batch (old_log_probs == new_log_probs.detach() at that step).
    ppo_epochs: 1
    max_grad_norm: 1.0
    clip_ratio_low: 0.2
    clip_ratio_high: 0.28
    padding_free: true
    dynamic_batching: true
    max_token_len_per_gpu: 24096
    ulysses_size: 1
    model:
      model_path: ${oc.env:TIMELENS_MODEL_PATH,/path/to/Qwen3.5-VL-4B}
      enable_gradient_checkpointing: true
      trust_remote_code: false
      freeze_vision_tower: true
    optim:
      lr: 1.0e-6
      weight_decay: 0.01
      strategy: adamw
      lr_warmup_ratio: 0.05
      lr_scheduler_type: constant
    fsdp:
      torch_dtype: bf16
      enable_full_shard: true
      enable_cpu_offload: false
      enable_rank0_init: true
    offload:
      offload_params: false
      offload_optimizer: false

  rollout:
    n: 8
    temperature: 1.0
    top_p: 0.85
    limit_images: 5
    gpu_memory_utilization: 0.5
    enforce_eager: false
    enable_chunked_prefill: true
    tensor_parallel_size: 1
    max_num_batched_tokens: 25000
    disable_tqdm: true

    # Must stay false when use_gt_injection=true: the trainer overwrites one
    # row's response tokens with the GT-built sequence, but vLLM's
    # rollout_log_probs are still those of the original online sample —
    # using them as old_log_probs would corrupt that row's PPO ratio.

    val_override_config:
      temperature: 0.7
      top_p: 0.95
      n: 1

  ref:
    fsdp:
      torch_dtype: bf16
      enable_full_shard: true
      enable_cpu_offload: false
      enable_rank0_init: true
    offload:
      offload_params: false

  reward:
    reward_function: scripts/timelens/timelens_reward.py:compute_score
    reward_function_kwargs: {}

trainer:
  total_epochs: 1
  max_steps: null
  project_name: TempSamp-R1
  experiment_name: "timelens_tempsamp"
  logger: ["console"]
  nnodes: 1
  n_gpus_per_node: 8
  val_freq: -1
  val_before_train: false
  val_only: false
  val_generations_to_log: 0
  save_freq: 20
  save_limit: 2
  save_model_only: false
  keep_optim_only_latest: true
  save_checkpoint_path: null
  load_checkpoint_path: null
  find_last_checkpoint: false
  keep_best_train_ckpt: ${oc.env:KEEP_BEST_TRAIN_CKPT,false}
  best_train_metric_key: ${oc.env:BEST_TRAIN_METRIC_KEY,reward/overall}
  best_train_smooth_window: ${oc.env:BEST_TRAIN_SMOOTH_WINDOW,5}
  best_train_min_step: ${oc.env:BEST_TRAIN_MIN_STEP,10}
